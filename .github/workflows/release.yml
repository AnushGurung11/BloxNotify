name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1) — used as tag v<version> for manual runs'
        required: true

jobs:
  release:
    name: Build & publish signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Secrets are not available in step-level `if` conditions, so they are
      # mapped to env vars at job level and referenced via env. instead.
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Write google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Write signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          name="${version%%+*}"
          code="${version#*+}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Tag runs use the tag that triggered them; manual runs get v<input>.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          ANDROID_STORE_FILE: release.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release --dart-define=API_BASE_URL=https://bloxnotify.onrender.com

      - name: Rename APK with version
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/blox-notify-${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag name computed in the version step: the triggering tag on tag
          # pushes, v<input> on manual runs (the action creates the tag if it
          # does not exist yet).
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: app/build/app/outputs/flutter-apk/blox-notify-*.apk